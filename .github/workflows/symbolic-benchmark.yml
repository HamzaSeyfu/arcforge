name: symbolic-benchmark

on:
  push:
    branches: ["research/40pct-candidate-expansion"]
    paths:
      - "src/arcforge/symbolic.py"
      - "scripts/benchmark_symbolic.py"
      - "scripts/benchmark_portfolio.py"
      - "scripts/benchmark_kaggle_eval.py"
      - "src/arcforge/synthesis.py"
      - "experiments/qwen_oracle_rows.json"
      - ".github/workflows/symbolic-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ARCForge
        uses: actions/checkout@v4
        with:
          ref: research/40pct-candidate-expansion

      - name: Checkout exact Kaggle public-eval snapshot
        uses: actions/checkout@v4
        with:
          repository: jaywang172/ARC-Prize-2026---ARC-AGI-2
          path: external/kaggle-eval
          fetch-depth: 1
          sparse-checkout: |
            arc-agi_evaluation_challenges.json
            arc-agi_evaluation_solutions.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ARCForge
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Benchmark on exact Kaggle evaluation
        run: |
          python scripts/benchmark_kaggle_eval.py \
            --challenges external/kaggle-eval/arc-agi_evaluation_challenges.json \
            --solutions external/kaggle-eval/arc-agi_evaluation_solutions.json \
            --qwen-oracle-rows experiments/qwen_oracle_rows.json \
            --output experiments/latest_kaggle_eval_benchmark.json

      - name: Commit benchmark report
        run: |
          git config user.name "arcforge-bot"
          git config user.email "arcforge-bot@users.noreply.github.com"
          git add experiments/latest_kaggle_eval_benchmark.json
          git diff --cached --quiet && exit 0
          git commit -m "Record latest symbolic benchmark"
          git push origin HEAD:research/40pct-candidate-expansion
