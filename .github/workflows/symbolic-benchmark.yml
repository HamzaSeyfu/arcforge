name: symbolic-benchmark

on:
  push:
    branches: ["research/40pct-candidate-expansion"]
    paths:
      - "src/arcforge/symbolic.py"
      - "scripts/benchmark_symbolic.py"
      - "scripts/benchmark_portfolio.py"
      - "src/arcforge/synthesis.py"
      - "experiments/qwen_oracle_rows.json"
      - ".github/workflows/symbolic-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ARCForge
        uses: actions/checkout@v4
        with:
          ref: research/40pct-candidate-expansion

      - name: Checkout official ARC-AGI-2 data
        uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-2
          path: external/ARC-AGI-2
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ARCForge
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Benchmark symbolic candidate generator
        run: |
          python scripts/benchmark_symbolic.py \
            --evaluation-dir external/ARC-AGI-2/data/evaluation \
            --task-list external/ARC-AGI-2/data/evaluation.txt \
            --qwen-oracle-rows experiments/qwen_oracle_rows.json \
            --output experiments/latest_symbolic_benchmark.json

      - name: Benchmark local portfolio
        run: |
          python scripts/benchmark_portfolio.py \
            --evaluation-dir external/ARC-AGI-2/data/evaluation \
            --task-list external/ARC-AGI-2/data/evaluation.txt \
            --qwen-oracle-rows experiments/qwen_oracle_rows.json \
            --output experiments/latest_portfolio_benchmark.json

      - name: Commit benchmark reports
        run: |
          git config user.name "arcforge-bot"
          git config user.email "arcforge-bot@users.noreply.github.com"
          git add experiments/latest_symbolic_benchmark.json experiments/latest_portfolio_benchmark.json
          git diff --cached --quiet && exit 0
          git commit -m "Record latest symbolic benchmark"
          git push origin HEAD:research/40pct-candidate-expansion
